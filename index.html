<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>우리기록</title>
<meta name="theme-color" content="#e4dcfa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#efe7fb;--bg2:#e4dcfa;--blob1:#f6c6ec;--blob2:#b9a6f5;--blob3:#d8c9ff;
  --card:rgba(255,255,255,.55);--card-solid:#fff;--line:rgba(120,110,160,.25);
  --ink:#1f1d2b;--sub:#6d6a7c;--faint:#a09cb0;--accent:#7b61ff;
  --me:#ff9db5;--you:#9cc0ff;--both:#f5a3c7;
  --sheet:#e9e9ee;--radius:24px;
}
[data-theme="peach"]{--bg1:#fff0e8;--bg2:#ffe1d6;--blob1:#ffc4a8;--blob2:#ff9fae;--blob3:#ffd9b8;--accent:#ff7a59}
[data-theme="mint"]{--bg1:#e6f7f1;--bg2:#d6f0ea;--blob1:#a8e6cf;--blob2:#7fd1c7;--blob3:#c9f2e0;--accent:#20a780}
[data-theme="sky"]{--bg1:#e7f0ff;--bg2:#dbe8ff;--blob1:#a9c8ff;--blob2:#8fb0ff;--blob3:#c7dcff;--accent:#3b7bff}
[data-theme="night"]{--bg1:#16151f;--bg2:#1d1b2b;--blob1:#4a2f6b;--blob2:#2d3a7a;--blob3:#3b2a55;--card:rgba(40,38,58,.6);--card-solid:#272536;--line:rgba(200,190,255,.18);--ink:#f2f0fa;--sub:#b3aec8;--faint:#7d7894;--accent:#a593ff;--sheet:#1b1a26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.75}
.bgfx i:nth-child(1){width:420px;height:420px;left:-180px;top:120px;background:radial-gradient(circle at 60% 40%,#fff8,var(--blob1) 55%,transparent 72%)}
.bgfx i:nth-child(2){width:380px;height:380px;right:-150px;bottom:40px;background:radial-gradient(circle at 35% 35%,#fffa,var(--blob2) 60%,transparent 75%)}
.bgfx i:nth-child(3){width:320px;height:320px;left:-140px;bottom:-120px;background:radial-gradient(circle at 60% 30%,#fff9,var(--blob3) 60%,transparent 74%)}
.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.brand .ic{font-size:20px}
.top .acts{display:flex;gap:16px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;position:relative;border-radius:10px}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;background:#ff4d6d;border:2px solid var(--bg1)}
.hero{display:flex;align-items:center;gap:14px;background:rgba(230,240,255,.75);border-radius:18px;padding:16px 18px;margin:10px 0 16px;backdrop-filter:blur(14px);width:100%;text-align:left}
[data-theme="night"] .hero{background:rgba(50,48,75,.7)}
.hero .h{font-size:26px}
.hero b{display:block;font-size:16px}
.hero span{font-size:13px;color:var(--sub)}
.hero .chev{margin-left:auto;color:var(--sub)}
.card{display:block;width:100%;text-align:left;background:var(--card);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.6);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(90,70,160,.12);position:relative}
[data-theme="night"] .card{border-color:rgba(255,255,255,.08)}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
.card h3 .r{margin-left:auto;font-weight:500;font-size:14px;color:var(--ink)}
.big{font-family:Inter;font-weight:800;font-size:34px;letter-spacing:-.5px}
.muted{color:var(--sub);font-size:13px}
.dash{border:1.5px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--sub);font-size:14px;min-height:88px;text-align:center;padding:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:16px;position:relative;overflow:hidden;border:1.5px dashed var(--line);display:flex;align-items:flex-end;padding:8px 10px;font-size:13px;font-weight:700;color:var(--sub)}
.tile.ph{border:0;color:#fff;text-shadow:0 1px 4px #0008;justify-content:center}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.tile.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#0007);z-index:-1}
.tile span{position:relative}
.pill{display:block;width:100%;background:var(--card-solid);border-radius:16px;padding:14px;text-align:center;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(60,50,110,.12);margin-top:14px}
.pill.pri{background:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .dash{aspect-ratio:.75;font-size:13px}
.ph2{aspect-ratio:.75;border-radius:14px;overflow:hidden;position:relative}
.ph2 img{width:100%;height:100%;object-fit:cover}
.ph2 em{position:absolute;left:8px;bottom:8px;color:#fff;font-style:normal;font-size:12px;font-weight:700;text-shadow:0 1px 4px #000a}
svg.map path{fill:var(--card-solid);stroke:var(--faint);stroke-width:.5;transition:fill .2s}
svg.map path.on{fill:var(--accent);fill-opacity:.75}
svg.map.click path{cursor:pointer}
svg.map.kr path{stroke-width:.8}
.cal{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:center}
.calph{aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--blob2),var(--blob1));color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 2px 6px #0006}
.calph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.calph *{position:relative}
.calph b{font-size:15px}.calph strong{font-family:Inter;font-size:52px;line-height:1;font-weight:800}
.mini{font-size:12px}
.mini .mh{font-weight:700;margin-bottom:6px;font-size:13px}
.mini table{width:100%;border-collapse:collapse;text-align:center}
.mini td,.mini th{padding:3px 0;font-weight:500;position:relative}
.mini th{font-weight:700}
.sun{color:#e5484d}.sat{color:#3b6fe0}
.mini td.today span{background:var(--ink);color:var(--card-solid);border-radius:50%;display:inline-block;width:20px;height:20px;line-height:20px}
.mini td.ev::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:12px;font-size:12px;font-weight:700;margin:-4px 0 12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;gap:4px}
.week .d{font-weight:700;padding:8px 0;border-radius:12px}
.week .d.fut{color:var(--faint)}
.week .d.me{background:color-mix(in srgb,var(--me) 45%,transparent)}
.week .d.you{background:color-mix(in srgb,var(--you) 55%,transparent)}
.week .d.both{background:linear-gradient(135deg,var(--me),var(--you))}
.week .d.both::after{content:"♥";display:block;font-size:10px;color:#fff;line-height:1}
.week .dw{color:var(--sub);font-weight:500}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bk{display:flex;gap:10px;align-items:center;margin-top:8px}
.bk .c{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.bk .c.on{background:var(--accent);border:0;color:#fff}
.bk .t{flex:1;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;font-size:14px;min-height:32px}
.bk .t.done{text-decoration:line-through;color:var(--sub)}
.note{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:44px;font-size:14px;margin-top:8px;white-space:pre-wrap;overflow:hidden;max-height:90px}
.empty-home{text-align:center;color:var(--sub);padding:40px 0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,16,40,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);background:var(--sheet);z-index:21;border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:3px;background:var(--faint);margin:10px auto 4px;flex:none}
.shead{display:flex;align-items:center;padding:6px 18px 10px;gap:8px;flex:none}
.shead h2{font-size:18px;margin:0;flex:1}
.sbody{overflow:auto;padding:4px 18px 40px;flex:1}
.gal .card{background:var(--card-solid);backdrop-filter:none;border:0;box-shadow:0 10px 26px rgba(40,30,80,.16);margin:0;pointer-events:none}
.gal .item{margin-bottom:22px}
.gal .lab{display:flex;justify-content:center;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-top:10px}
.gal .lab small{color:var(--faint);font-weight:500}
.gal .item.added .card{opacity:.6}
.gal button.item{display:block;width:100%;text-align:left}

/* page */
.page{position:fixed;inset:0;z-index:30;background:var(--card-solid);overflow:auto;transform:translateX(100%);transition:transform .28s}
.page.on{transform:none}
.page .in{max-width:480px;margin:0 auto;padding:0 16px 40px}
.ptop{display:flex;align-items:center;height:56px;position:sticky;top:0;background:var(--card-solid);z-index:2}
.ptop h2{flex:1;text-align:center;margin:0;font-size:17px;margin-right:30px}
.group{border:1.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);margin:18px 0;overflow:hidden;background:var(--card-solid)}
.group button{display:flex;align-items:center;gap:14px;width:100%;padding:17px 18px;font-size:15px;text-align:left}
.group button+button{border-top:1px solid var(--line)}
.group svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.group .v{margin-left:auto;color:var(--sub);font-size:14px}
.group .ch{color:var(--faint);margin-left:8px}
.group .v+.ch{margin-left:6px}
.group .v:empty+.ch{margin-left:auto}

/* forms & lists */
.f{display:flex;flex-direction:column;gap:12px}
.f label{font-size:13px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.in1{width:100%;border:1px solid var(--line);background:var(--card-solid);border-radius:12px;padding:12px;font-size:15px;outline:none}
.in1:focus{border-color:var(--accent)}
textarea.in1{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;background:var(--card-solid);font-size:13px;font-weight:700;border:1px solid var(--line)}
.chip.on{background:var(--ink);color:var(--card-solid);border-color:var(--ink)}
.stars button{font-size:24px;color:var(--faint)}
.stars button.on{color:#ffb400}
.photo-in{display:flex;align-items:center;gap:10px}
.photo-in .pv{width:64px;height:64px;border-radius:12px;background:var(--card-solid) center/cover;border:1px dashed var(--line);display:grid;place-items:center;font-size:22px;color:var(--faint)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:var(--card-solid);border-radius:16px;padding:12px;text-align:left;width:100%}
.row .th{width:56px;height:56px;border-radius:12px;background:var(--line) center/cover;flex:none;display:grid;place-items:center;font-size:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{color:var(--sub);font-size:12px}
.row .amt{font-weight:800;font-family:Inter}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative}
.grid3 img{width:100%;height:100%;object-fit:cover}
.grid3 em{position:absolute;left:6px;bottom:6px;font-style:normal;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px #000}
.sec{font-weight:800;font-size:15px;margin:22px 0 10px;display:flex;align-items:center}
.sec small{margin-left:auto;color:var(--sub);font-weight:500}
.danger{color:#e5484d;font-weight:700;font-size:14px;padding:12px;width:100%;margin-top:10px}
.blockctl{display:flex;gap:8px;margin-top:26px}
.blockctl button{flex:1;padding:12px;border-radius:12px;background:var(--card-solid);font-size:13px;font-weight:700}
.viewimg{width:100%;border-radius:16px;margin-bottom:12px;max-height:60vh;object-fit:cover}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:var(--card-solid);padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.themes button{aspect-ratio:1;border-radius:16px;border:2px solid transparent;font-size:12px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.themes button.on{border-color:var(--ink)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icons button{font-size:26px;aspect-ratio:1;border-radius:12px;background:var(--card-solid);border:2px solid transparent}
.icons button.on{border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px;padding-bottom:2px}
.feed .row{align-items:flex-start}
.status{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.setrow{display:flex;align-items:center;gap:10px;background:var(--card-solid);border-radius:14px;padding:14px;font-size:15px}
.setrow span{flex:1}
.cnt{display:flex;gap:6px;flex-wrap:wrap}
.cnt .chip{font-weight:500}
.mlist{max-height:260px;overflow:auto}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.daygrid div{padding:7px 0;border-radius:10px}
#gate[hidden]{display:none}
#gate{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:grid;place-items:center;padding:24px;overflow:auto}
.gbox{width:100%;max-width:360px;text-align:center}
.gbox h1{margin:8px 0 4px;font-size:26px}
.gbox .f{text-align:left}
.sep{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:22px 0 12px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.gerr{color:#e5484d;font-size:13px;min-height:18px}
.page .in{padding-top:env(safe-area-inset-top)}
.ib{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--card-solid);border-radius:18px;padding:14px 16px;margin:8px 0 4px;box-shadow:0 8px 20px rgba(40,30,80,.25)}
.ib .t{flex:1;font-size:13px;line-height:1.45}.ib .t b{font-size:15px;display:block;margin-bottom:2px}
.ib .go{background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;flex:none}
.ib .x{color:var(--faint);font-size:18px;padding:4px;flex:none}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:14px 0}
.steps div{counter-increment:s;display:block;position:relative;background:var(--card-solid);border-radius:14px;padding:14px 14px 14px 54px;font-size:15px;line-height:1.5}
.steps div::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;position:absolute;left:14px;top:50%;margin-top:-14px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--bg1);font-weight:700}
</style>
</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="ic" id="appIcon">💜</span><span id="appName">우리기록</span></div>
    <div class="acts">
      <button class="iconbtn" id="btnAdd" aria-label="블록 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="btnBell" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><i class="badge" id="bellDot" hidden></i></button>
      <button class="iconbtn" id="btnSet" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>
  <div id="installBar"></div>
  <button class="hero" id="hero"></button>
  <div id="home"></div>
  <div class="status" id="status"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="shead"><h2 id="sTitle"></h2><button class="iconbtn" id="sClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sbody" id="sBody"></div></div>
<div class="page" id="page"><div class="in"><div class="ptop"><button class="iconbtn" id="pBack" aria-label="뒤로"><svg viewBox="0 0 24 24" style="stroke:var(--ink);fill:none;stroke-width:2;width:22px;height:22px"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="pTitle"></h2></div><div id="pBody"></div></div></div>
<div class="toast" id="toast"></div>
<div id="gate" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<script src="firebase-config.js"></script>
<script src="maps.js"></script>
<script>
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
const DAY = 86400000;
const won = n => (Math.round(n) || 0).toLocaleString("ko-KR") + "원";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }

// ---------- store (Firebase, or demo mode on this device) ----------
const DEFAULT_SETTINGS = { appName: "우리기록", appIcon: "💜", theme: "lavender", startDate: "", countFromOne: true, habitName: "습관 체크", blocks: ["dday", "food", "culture"], members: {}, feed: true };
const S = { mode: "loading", fb: null, F: null, auth: null, uid: "me", spaceId: null, space: null, settings: { ...DEFAULT_SETTINGS, ...lsGet("wr_settings_cache", {}) }, items: [], names: {}, canWrite: true, unsubs: [] };
let writeChain = Promise.resolve();
function queue(fn) {
  writeChain = writeChain.then(fn).catch(e => {
    console.error(e);
    const c = e && e.code || "";
    if (c.includes("permission-denied")) toast("권한이 없어 저장하지 못했어요. 커플 연결을 확인해 주세요");
    else if (c.includes("invalid-argument") || c.includes("resource-exhausted")) toast("사진이나 내용이 너무 커서 저장하지 못했어요");
    else toast("저장하지 못했어요. 인터넷 연결을 확인해 주세요");
  });
  return writeChain;
}
function localPersist() { if (!lsSet("wr_settings", S.settings) || !lsSet("wr_items", S.items)) toast("기기 저장 공간이 부족해요"); }
function setStatus(t) { $("#status").textContent = t; }

const CFG = window.FIREBASE_CONFIG || {};
async function initStore() {
  if (!CFG.apiKey || !CFG.projectId) {
    S.mode = "local";
    S.settings = { ...DEFAULT_SETTINGS, ...lsGet("wr_settings", {}) };
    S.items = lsGet("wr_items", []);
    setStatus("체험 모드: firebase-config.js를 설정하면 상대방과 함께 쓸 수 있어요.");
    refresh();
    return;
  }
  let F;
  try { F = await import("./fb.js"); } catch (e) { setStatus("앱을 불러오지 못했어요. 새로고침해 주세요."); return; }
  S.F = F;
  const app = F.initializeApp(CFG);
  S.auth = F.getAuth(app);
  try { S.fb = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch { S.fb = F.initializeFirestore(app, {}); }
  F.getRedirectResult(S.auth).catch(e => console.warn(e));
  F.onAuthStateChanged(S.auth, async u => {
    detachSpace();
    if (!u) { S.mode = "loading"; showGate("login"); return; }
    S.uid = u.uid; S.names[u.uid] = u.displayName || (u.email || "").split("@")[0] || "나";
    let sid = null;
    try { const ud = await F.getDoc(F.doc(S.fb, "users", u.uid)); sid = ud.exists() ? ud.data().spaceId : null; } catch (e) { console.warn(e); }
    if (!sid) { showGate("space"); return; }
    attachSpace(sid);
  });
}
function detachSpace() { S.unsubs.forEach(f => { try { f(); } catch { } }); S.unsubs = []; S.spaceId = null; S.space = null; S.items = []; }
function attachSpace(sid) {
  const F = S.F; S.spaceId = sid; S.mode = "fb"; hideGate();
  let loaded = false;
  const timer = setTimeout(() => { if (!loaded) setStatus("서버에 연결하는 중이에요… 인터넷 연결을 확인해 주세요."); }, 10000);
  S.unsubs.push(F.onSnapshot(F.doc(S.fb, "spaces", sid), snap => {
    if (!snap.exists() || !(snap.data().members || []).includes(S.uid)) { lsSet("wr_settings_cache", {}); showGate("space"); detachSpace(); return; }
    S.space = snap.data(); refresh();
  }, e => { console.warn(e); showGate("space"); }));
  S.unsubs.push(F.onSnapshot(F.doc(S.fb, "spaces", sid, "meta", "settings"), snap => {
    S.settings = { ...DEFAULT_SETTINGS, ...(snap.exists() ? snap.data() : {}) };
    lsSet("wr_settings_cache", { theme: S.settings.theme, appName: S.settings.appName, appIcon: S.settings.appIcon });
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); setStatus(""); }
    const me = (S.settings.members || {})[S.uid];
    if (snap.exists() && !snap.metadata.fromCache && !(me && me.nick)) {
      const m = JSON.parse(JSON.stringify(S.settings.members || {})); m[S.uid] = { ...(m[S.uid] || {}), nick: S.names[S.uid] || "나" }; saveSettings({ members: m });
    }
    refresh();
  }, e => console.warn(e)));
  S.unsubs.push(F.onSnapshot(F.collection(S.fb, "spaces", sid, "items"), snap => {
    S.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refresh();
  }, e => console.warn(e)));
}
function saveSettings(patch) {
  S.settings = { ...S.settings, ...patch };
  refresh();
  if (S.mode === "fb") { const body = JSON.parse(JSON.stringify(S.settings)); return queue(() => S.F.setDoc(S.F.doc(S.fb, "spaces", S.spaceId, "meta", "settings"), body)); }
  localPersist();
}
function addItem(obj) {
  const it = { ...obj, author: S.uid, createdAt: Date.now() };
  if (S.mode === "fb") { const ref = S.F.doc(S.F.collection(S.fb, "spaces", S.spaceId, "items")); return queue(() => S.F.setDoc(ref, it)); }
  S.items.push({ id: uidGen(), ...it }); localPersist(); refresh();
}
function updateItem(id, patch) {
  const cur = S.items.find(x => x.id === id); if (!cur) return;
  const next = { ...cur, ...patch }; delete next.id;
  if (S.mode === "fb") return queue(() => S.F.setDoc(S.F.doc(S.fb, "spaces", S.spaceId, "items", id), next));
  Object.assign(cur, patch); localPersist(); refresh();
}
function delItem(id) {
  if (S.mode === "fb") return queue(() => S.F.deleteDoc(S.F.doc(S.fb, "spaces", S.spaceId, "items", id)));
  S.items = S.items.filter(x => x.id !== id); localPersist(); refresh();
}

// ---------- couple space: create / join / leave ----------
function makeCode() { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const r = crypto.getRandomValues(new Uint32Array(8)); return [...r].map(n => A[n % A.length]).join(""); }
async function createSpace() {
  const F = S.F, code = makeCode();
  await F.setDoc(F.doc(S.fb, "spaces", code), { members: [S.uid], createdAt: Date.now() });
  await F.setDoc(F.doc(S.fb, "spaces", code, "meta", "settings"), { ...DEFAULT_SETTINGS, members: { [S.uid]: { nick: S.names[S.uid] || "나" } } });
  await F.setDoc(F.doc(S.fb, "users", S.uid), { spaceId: code });
  attachSpace(code);
}
async function joinSpace(raw) {
  const F = S.F, code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 8) throw new Error("초대코드는 8자리예요");
  try { await F.updateDoc(F.doc(S.fb, "spaces", code), { members: F.arrayUnion(S.uid) }); }
  catch (e) {
    let already = false; try { const d = await F.getDoc(F.doc(S.fb, "spaces", code)); already = d.exists() && (d.data().members || []).includes(S.uid); } catch { }
    if (!already) throw new Error((e.code || "").includes("not-found") ? "없는 초대코드예요" : "코드가 맞지 않거나 이미 두 사람이 연결된 공간이에요"); }
  await F.setDoc(F.doc(S.fb, "users", S.uid), { spaceId: code });
  attachSpace(code);
}
async function leaveSpace() {
  const F = S.F, sid = S.spaceId;
  try { await F.updateDoc(F.doc(S.fb, "spaces", sid), { members: F.arrayRemove(S.uid) }); } catch (e) { console.warn(e); }
  await F.setDoc(F.doc(S.fb, "users", S.uid), { spaceId: null });
  detachSpace(); showGate("space");
}

function authMsg(e) {
  const c = e && e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "이메일이나 비밀번호가 맞지 않아요";
  if (c.includes("email-already-in-use")) return "이미 가입된 이메일이에요. 로그인을 눌러주세요";
  if (c.includes("weak-password")) return "비밀번호는 6자 이상이어야 해요";
  if (c.includes("invalid-email")) return "이메일 형식이 맞지 않아요";
  if (c.includes("unauthorized-domain")) return "이 주소가 Firebase 승인 도메인에 없어요 (README 4단계)";
  if (c.includes("operation-not-allowed")) return "Firebase에서 이 로그인 방식이 꺼져 있어요 (README 3단계)";
  if (c.includes("network")) return "인터넷 연결을 확인해 주세요";
  return "로그인하지 못했어요 (" + c + ")";
}

function pickPhoto() {
  return new Promise(res => {
    const f = $("#fileIn"); f.value = "";
    f.onchange = () => res(f.files && f.files[0] || null);
    f.click();
  });

async function processPhoto(file) {
  if (!file) return null;
  const img = await new Promise((ok, no) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });
  const max = S.mode === "fb" ? 1000 : 640;
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let q = .75, out = c.toDataURL("image/jpeg", q);
  while (out.length > 700000 && q > .35) { q -= .1; out = c.toDataURL("image/jpeg", q); }
  return out;
}

function ddayNum() {
  const s = S.settings.startDate; if (!s) return null;
  const diff = Math.floor((parseD(today()) - parseD(s)) / DAY);
  return diff + (S.settings.countFromOne ? 1 : 0);
}
function weekDays(base = new Date()) { const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() - base.getDay()); return [...Array(7)].map((_, i) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + i)); }
function habitState(date) {
  const hs = S.items.filter(i => i.type === "habit" && i.date === date);
  const me = hs.some(isMe), you = hs.some(i => !isMe(i));
  return me && you ? "both" : me ? "me" : you ? "you" : "";

function cardHTML(id) {

  const head = (r = "") => `<h3><span>${b.ic}</span> ${esc(id === "habit" ? st.habitName || b.name : b.name)}${r ? `<span class="r">${r}</span>` : ""}</h3>`;
  switch (id) {
    case "dday": { const n = ddayNum(); return head() + (n == null ? `<div class="big" style="color:var(--faint)">D+?</div><div class="muted" style="margin-top:6px">처음 만난 날을 정해주세요</div>` : `<div class="big">D${n >= 0 ? "+" : ""}${n}</div>`); }
    case "food": case "culture": {
      const list = items(id), cats = id === "food" ? FOOD_CATS : CULT_CATS;

      if (!list.length) return head() + `<div class="tiles">${cats.slice(0, 3).map(c => `<div class="tile"><span>${c}</span></div>`).join("")}</div>`;
      const byCat = cats.map(c => ({ c, l: list.filter(x => x.cat === c) })).filter(x => x.l.length).sort((a, b) => b.l.length - a.l.length);
      const show = byCat.slice(0, 3); cats.filter(c => !show.some(x => x.c === c)).forEach(c => { if (show.length < 3) show.push({ c, l: [] }); });
      return head() + `<div class="tiles">${show.map(x => { const p = x.l.find(i => safeSrc(i.photo)); return p ? `<div class="tile ph"><img src="${safeSrc(p.photo)}" alt=""><span>${x.c} ${x.l.length}</span></div>` : `<div class="tile"><span>${x.c}${x.l.length ? " " + x.l.length : ""}</span></div>`; }).join("")}</div>`;

    case "album": {

      const t = (it, emp, who) => it ? `<div class="ph2"><img src="${safeSrc(it.photo)}" alt=""><em>${esc(who)}</em></div>` : `<div class="dash">${emp}</div>`;
      return head(l.length ? l.length + "장" : "") + `<div class="two">${t(mine, "실시간 사진을 올려보세요!", myName())}${t(yours, "상대방 사진은 아직이에요", partnerName())}</div><button class="pill" data-act="albumAdd">사진 찍기</button>`;

      return head(l.length ? "이번 달" : "") + `<div class="big" style="font-size:26px">${won(month)}</div><button class="pill" data-act="budgetAdd">데이트 추가</button>`;

    }
    case "habit": {
      const wk = weekDays(); let me = 0, you = 0, both = 0;
      const cells = wk.map(d => { const k = ymd(d), s = habitState(k); if (s === "both") { both++; me++; you++; } else if (s === "me") me++; else if (s === "you") you++; return `<div class="d ${k > today() ? "fut" : ""} ${s}">${d.getDate()}</div>`; });
      return head() + `<div class="legend"><span><i style="background:var(--me)"></i>${esc(myName())} ${me}</span><span><i style="background:var(--you)"></i>${esc(partnerName())} ${you}</span><span><i style="background:var(--both)"></i>같이 ${both}</span></div><div class="week">${WD.map(w => `<div class="dw">${w}</div>`).join("")}${cells.join("")}</div><button class="pill" data-act="habitToggle">${S.items.some(i => i.type === "habit" && i.date === today() && isMe(i)) ? "오늘 체크 완료 ✓" : "오늘 체크하기"}</button>`;
    }
    case "free": { const l = items("free"); const sh = l.slice(0, 2); while (sh.length < 2) sh.push(null); return head(`${l.length}개`) + sh.map(n => `<div class="note">${n ? `<b>${esc(n.title || "")}</b>${n.title ? "\n" : ""}${esc(n.text || "")}` : ""}</div>`).join(""); }
    case "bucket": {
      const l = items("bucket").sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.createdAt - b.createdAt); const done = l.filter(i => i.done).length; const p = l.length ? Math.round(done / l.length * 100) : 0;
      const sh = l.slice(0, 3); const rows = sh.map(i => `<div class="bk"><span class="c ${i.done ? "on" : ""}">${i.done ? "✓" : ""}</span><span class="t ${i.done ? "done" : ""}">${esc(i.text)}</span></div>`);
      while (rows.length < 2) rows.push(`<div class="bk"><span class="c"></span><span class="t"></span></div>`);
      return head() + `<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="muted">${done}개 달성</span><b style="font-size:18px">${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>${rows.join("")}`;
    }
  }
  return "";
}
function miniCal(y, m, big) {
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), t = today();
  const evs = new Set(S.items.filter(i => i.type === "event").map(i => i.date));
  let cells = [...Array(first.getDay())].map(() => "<td></td>");
  for (let d = 1; d <= days; d++) { const k = `${y}-${pad(m + 1)}-${pad(d)}`, wd = (first.getDay() + d - 1) % 7; cells.push(`<td class="${wd === 0 ? "sun" : wd === 6 ? "sat" : ""} ${k === t ? "today" : ""} ${evs.has(k) ? "ev" : ""}" ${big ? `data-day="${k}" style="cursor:pointer;padding:8px 0"` : ""}><span>${d}</span></td>`); }
  let rows = ""; for (let i = 0; i < cells.length; i += 7) rows += "<tr>" + cells.slice(i, i + 7).join("") + "</tr>";
  return `<div class="mini" ${big ? 'style="font-size:14px"' : ""}><div class="mh">${big ? y + "년 " : ""}${m + 1}월</div><table><tr>${WD.map((w, i) => `<th class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</th>`).join("")}</tr>${rows}</table></div>`;
}

// ---------- sheet / page ----------
let sheetHist = false, pageHist = 0, skipPop = 0;
window.addEventListener("popstate", () => {
  if (skipPop > 0) { skipPop--; return; }
  if ($("#sheet").classList.contains("on")) { sheetHist = false; realCloseSheet(); return; }
  if (pageStack.length) { pageHist = Math.max(0, pageHist - 1); pageStack.pop(); showPage(); }
});
function openSheet(title, render) {
  if (!$("#sheet").classList.contains("on") && !sheetHist) { try { history.pushState({ w: "sheet" }, ""); sheetHist = true; } catch { } }
  $("#sTitle").textContent = title;
  sheetRender = () => { const b = $("#sBody"), y = b.scrollTop; const active = document.activeElement; if (active && b.contains(active) && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return; render(b); b.scrollTop = y; };
  render($("#sBody")); $("#sBody").scrollTop = 0;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
}
function realCloseSheet() { sheetRender = null; $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
function closeSheet() { if (sheetHist) { sheetHist = false; realCloseSheet(); skipPop++; try { history.back(); } catch { skipPop--; } return; } realCloseSheet(); }
$("#scrim").onclick = closeSheet; $("#sClose").onclick = closeSheet;
(function dragClose() { let y0 = null; const g = $("#sheet"); g.addEventListener("touchstart", e => { if ($("#sBody").scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true }); g.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }); $(".grab").onclick = closeSheet; })();
const pageStack = [];
function openPage(title, render) { pageStack.push({ title, render }); try { history.pushState({ w: "page" }, ""); pageHist++; } catch { } showPage(); }
function showPage() { const p = pageStack[pageStack.length - 1]; if (!p) { pageRender = null; $("#page").classList.remove("on"); return; } $("#pTitle").textContent = p.title; pageRender = () => { const a = document.activeElement; if (a && $("#pBody").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; p.render($("#pBody")); }; p.render($("#pBody")); $("#page").classList.add("on"); $("#page").scrollTop = 0; }
$("#pBack").onclick = () => { if (pageHist > 0) { history.back(); } else { pageStack.pop(); showPage(); } };

// ---------- item view / forms ----------
function viewItem(itemId) {
  const it = S.items.find(x => x.id === itemId); if (!it) return;
  const back = it.type;
  openSheet(BLOCKS[it.type === "event" ? "calendar" : it.type]?.name || "기록", body => {
    const cur = S.items.find(x => x.id === itemId); if (!cur) { openBlock(back); return; }
    body.innerHTML = `${safeSrc(cur.photo) ? `<img class="viewimg" src="${safeSrc(cur.photo)}" alt="">` : ""}
      ${cur.title ? `<h2 style="margin:4px 0">${esc(cur.title)}</h2>` : ""}
      <div class="muted">${esc(cur.date)}${cur.cat ? " · " + esc(cur.cat) : ""} · ${esc(nameOf(cur.author))} ${cur.mood ? esc(cur.mood) : ""} <span style="color:#ffb400">${starStr(cur.rating)}</span></div>
      ${cur.place ? `<div class="muted" style="margin-top:4px">📍 ${esc(cur.place)}</div>` : ""}
      ${cur.text ? `<p style="white-space:pre-wrap;line-height:1.6">${esc(cur.text)}</p>` : ""}
      <div class="blockctl"><button data-b>← 목록</button>${cur.type !== "album" ? `<button data-e>수정</button>` : ""}<button data-d style="color:#e5484d">삭제</button></div>`;
    body.querySelector("[data-b]").onclick = () => openBlock(back);
    const e = body.querySelector("[data-e]"); if (e) e.onclick = () => openForm(cur.type, cur.id);
    body.querySelector("[data-d]").onclick = function () { if (this.dataset.sure) { delItem(cur.id); openBlock(back); } else { this.dataset.sure = 1; this.textContent = "정말 삭제할까요?"; } };
  });
}
function openForm(type, editId, presetCat) {
  const ex = editId ? S.items.find(x => x.id === editId) : null;
  const v = ex ? { ...ex } : { date: today(), cat: presetCat || (type === "food" ? FOOD_CATS[0] : type === "culture" ? CULT_CATS[0] : type === "budget" ? BUD_CATS[0] : ""), rating: 0, payer: "both", mood: "😊" };
  const titles = { food: "맛집 기록", culture: "문화생활 기록", budget: "데이트 비용", diary: "오늘의 일기", free: "메모" };
  openSheet(titles[type] + (ex ? " 수정" : ""), body => {
    const cats = type === "food" ? FOOD_CATS : type === "culture" ? CULT_CATS : type === "budget" ? BUD_CATS : null;
    let h = `<form class="f" id="fm">`;
    if (cats) h += `<label>분류<div class="chips">${cats.map(c => `<button type="button" class="chip ${v.cat === c ? "on" : ""}" data-cat="${c}">${c}</button>`).join("")}</div></label>`;
    if (type === "food") h += `<label>가게 이름<input class="in1" name="title" required value="${esc(v.title)}" placeholder="예: 성수동 파스타집"></label><label>위치 (선택)<input class="in1" name="place" value="${esc(v.place)}" placeholder="예: 서울 성동구"></label>`;
    if (type === "culture") h += `<label>제목<input class="in1" name="title" required value="${esc(v.title)}" placeholder="예: 영화 제목, 전시 이름, 경기"></label><label>장소 (선택)<input class="in1" name="place" value="${esc(v.place)}"></label>`;
    if (type === "budget") h += `<label>금액 (원)<input class="in1" name="amount" type="number" inputmode="numeric" min="0" required value="${esc(v.amount)}" placeholder="0"></label><label>내용<input class="in1" name="title" value="${esc(v.title)}" placeholder="예: 저녁 식사"></label><label>누가 냈나요?<div class="chips">${[["me", myName()], ["you", partnerName()], ["both", "같이"]].map(([k, n]) => `<button type="button" class="chip ${v.payer === k ? "on" : ""}" data-payer="${k}">${esc(n)}</button>`).join("")}</div></label>`;
    if (type === "free") h += `<label>제목<input class="in1" name="title" value="${esc(v.title)}"></label>`;
    if (type === "diary") h += `<label>기분<div class="chips">${["😊", "🥰", "😆", "😌", "😢", "😠", "😴"].map(m => `<button type="button" class="chip ${v.mood === m ? "on" : ""}" data-mood="${m}" style="font-size:18px;padding:6px 10px">${m}</button>`).join("")}</div></label>`;
    if (type !== "free") h += `<label>날짜<input class="in1" type="date" name="date" value="${esc(v.date)}" required></label>`;
    if (type === "food" || type === "culture") h += `<label>별점<div class="stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="${n <= v.rating ? "on" : ""}" data-star="${n}">★</button>`).join("")}</div></label>`;
    if (type === "food" || type === "culture" || type === "diary") h += `<label>사진<div class="photo-in"><div class="pv" id="pv" style="${safeSrc(v.photo) ? `background-image:url('${safeSrc(v.photo)}')` : ""}">${safeSrc(v.photo) ? "" : "📷"}</div><button type="button" class="chip" id="pp">${v.photo ? "바꾸기" : "사진 고르기"}</button>${v.photo ? `<button type="button" class="chip" id="px">빼기</button>` : ""}</div></label>`;
    h += `<label>${type === "diary" ? "오늘 있었던 일" : type === "free" ? "내용" : "메모"}<textarea class="in1" name="text" ${type === "diary" || type === "free" ? "required" : ""} placeholder="${type === "diary" ? "오늘 하루는 어땠나요?" : ""}">${esc(v.text)}</textarea></label>`;
    h += `<button class="pill pri" type="submit">${ex ? "저장" : "기록하기"}</button>${ex ? `<button type="button" class="danger" id="fdel">삭제</button>` : ""}</form>`;
    body.innerHTML = h;
    const fm = $("#fm");
    const sync = () => { const fd = new FormData(fm); for (const [k, val] of fd) v[k] = val; };
    fm.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { sync(); v.cat = b.dataset.cat; sheetRender(); });
    fm.querySelectorAll("[data-payer]").forEach(b => b.onclick = () => { sync(); v.payer = b.dataset.payer; sheetRender(); });
    fm.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => { sync(); v.mood = b.dataset.mood; sheetRender(); });
    fm.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { sync(); v.rating = v.rating === +b.dataset.star ? 0 : +b.dataset.star; sheetRender(); });
    const pp = $("#pp"); if (pp) pp.onclick = async () => { sync(); const f = await pickPhoto(); if (!f) return; pp.textContent = "올리는 중…"; v.photo = await processPhoto(f); sheetRender(); };
    const px = $("#px"); if (px) px.onclick = () => { sync(); v.photo = ""; sheetRender(); };
    const fd = $("#fdel"); if (fd) fd.onclick = function () { if (this.dataset.sure) { delItem(ex.id); openBlock(type); } else { this.dataset.sure = 1; this.textContent = "한 번 더 누르면 삭제돼요"; } };
    fm.onsubmit = e => {
      e.preventDefault(); sync();
      const out = { type, date: v.date || today() };
      ["title", "place", "text", "cat", "photo", "mood", "payer"].forEach(k => { if (v[k] != null && v[k] !== "") out[k] = v[k]; });
      if (type === "food" || type === "culture") out.rating = v.rating || 0;
      if (type === "budget") out.amount = Math.max(0, +v.amount || 0);
      if (type !== "diary") delete out.mood;

  const el = $("#installBar"); if (!el) return;
  if (ENV.standalone || lsGet("wr_ib_x", 0) > Date.now()) { el.innerHTML = ""; return; }
  if (!ENV.mobile && !installEvt) { el.innerHTML = ""; return; }
  const msg = ENV.inapp ? ["외부 브라우저에서 열어주세요", "지금 앱 안의 브라우저에선 설치가 안 돼요"] : ["홈 화면에 앱으로 설치하기", "아이콘을 눌러 앱처럼 바로 열 수 있어요"];
  el.innerHTML = `<div class="ib"><div class="t"><b>📲 ${msg[0]}</b>${msg[1]}</div><button class="go" id="ibGo">${ENV.inapp ? "열기" : "설치"}</button><button class="x" id="ibX" aria-label="닫기">✕</button></div>`;
  $("#ibGo").onclick = () => ENV.inapp && (ENV.kakao || ENV.android) ? openExternal() : doInstall();
  $("#ibX").onclick = () => { lsSet("wr_ib_x", Date.now() + 3 * DAY); renderInstallBar(); };
}
window.addEventListener("appinstalled", () => { installEvt = null; renderInstallBar(); });

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(e => console.warn(e));

// ---------- auto update ----------
const BUILD = "b5";
let updShown = false;
async function checkUpdate() {
  if (updShown || !navigator.onLine || location.protocol === "file:") return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = await r.json();
    if (v.build && v.build !== BUILD) {
      const busy = $("#sheet").classList.contains("on") || pageStack.length || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "");
      if (!busy && document.visibilityState === "visible" && !sessionStorage.getItem("wr_upd_" + v.build)) { try { sessionStorage.setItem("wr_upd_" + v.build, "1"); } catch { } location.reload(); return; }
      updShown = true;
      const el = document.createElement("div");
      el.className = "ib"; el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:452px;z-index:45";
      el.innerHTML = `<div class="t"><b>✨ 새 버전이 나왔어요</b>${esc(v.note || "누르면 바로 적용돼요")}</div><button class="go">적용</button>`;
      el.querySelector(".go").onclick = () => location.reload();
      document.body.appendChild(el);
    }
  } catch { }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
window.addEventListener("online", checkUpdate);
setInterval(checkUpdate, 3 * 60 * 1000);
setTimeout(checkUpdate, 4000);
refresh();
renderInstallBar();
initStore();
</script>
</body>
