name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor 설치
        run: npm install

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 아이콘·스플래시·버전 적용
        env:
          RUN: ${{ github.run_number }}
        run: |
          RES=android/app/src/main/res
          cp -r res-overlay/. $RES/
          for f in $(find $RES -name splash.png); do
            case "$f" in *land*) cp splash_land.png "$f" ;; *) cp splash_port.png "$f" ;; esac
          done
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $RUN/; s/versionName \"[^\"]*\"/versionName \"1.0.$RUN\"/" $G
          grep -E "versionCode|versionName" $G

      - name: 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 서명
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD || 'woori-keystore-1' }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.keystore; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias woori --ks-pass pass:$PW --key-pass pass:$PW --out woori.apk aligned.apk
          "$BT/apksigner" verify --print-certs woori.apk | head -3
          ls -la woori.apk

      - name: 다운로드 링크(Release)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" woori.apk \
            --title "우리기록 안드로이드 앱 $TAG" \
            --notes "휴대폰에서 woori.apk를 눌러 받은 뒤 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱' 허용이 필요해요." \
            --latest
